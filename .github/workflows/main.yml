name: Build
on: [push, pull_request]
permissions:
  models: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm install --save-dev typescript ts-node @types/node
      - run: npx tsc --noEmit
  ask-ai:
    runs-on: ubuntu-latest
    steps:
      - name: AI Inference
        id: ai-response
        uses: actions/ai-inference@v2
        with:
            token: ${{ secrets.GITHUB_TOKEN }}
            prompt: |
              Please give me a programming joke.

      - name: Display AI Response
        run: |
          echo "## 🤖 AI Response" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.ai-response.outputs.response }}" >> $GITHUB_STEP_SUMMARY
